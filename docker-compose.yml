services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transport']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://transport:transport@db:5432/transport
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  db_data:
